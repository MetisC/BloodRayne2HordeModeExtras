; BloodRayne 2 - Enhanced Combat
; Normal uses the original combat rules. Use 0 to disable a switch and 1 to enable it.
; Use a decimal point. Values are clamped to the supported ranges.

[Enhanced]

; Parry and the escape from a repelled frontal feeding attempt. Set to 0 to disable both.
parryEnabled=1

; Parry window in game-time milliseconds. It follows the native time powers.
parryWindowMs=200

; Enemy hits are ignored for this many game-time milliseconds after a successful parry.
; Follows time powers and combat slowdown. Set to 0 to disable this protection.
parryGuardMs=250

; Time before the enemy's follow-up in which a fresh Parry press queues a back roll.
; Uses enemy animation time, including native time powers. 0 disables this escape only.
feedEscapeWindowMs=300

; Back-roll animation playback multiplier and extra collision-checked travel.
; Distance uses world units. Travel duration uses game-time milliseconds.
feedEscapeRollRate=1.0
feedEscapeTravelDistance=3.5
feedEscapeTravelMs=180

; Preserve the starting facing by removing the escape roll's authored half-turn.
feedEscapeKeepFacing=1

; Maximum parry window in real-time milliseconds, including during Freeze Time.
parryMaxInputMs=1200

; Cooldown in real-time milliseconds after a parry or an expired window. Presses during cooldown do not rearm it.
parryCooldownMs=240

; Ignore repeated contact from the same deflected hit for this many real-time milliseconds.
parryRepeatMs=1400

; Minimum clock multiplier used to advance the parry window.
parryClockFloor=0.25

; Global slowdown hold and return to normal speed, in real-time milliseconds.
parrySlowHoldMs=300
parrySlowFadeMs=420

; World speed multiplier and additional multiplier for the parried attacker.
parryWorldRate=0.40
parryAttackerRate=0.20

; Minimum and maximum native hit severity eligible for a parry.
parryMinSeverity=1
parryMaxSeverity=4

; Parry feedback. Spark scale and lifetime apply to the spawned effect.
parrySound=1
parrySpark=1
parrySparkScale=2.0
parrySparkMs=1000
parryFallbackSparkMs=250
parryShake=4000.0
parryShakeMs=250

; Hitstop applies during native time powers. 1 slows world simulation, 0 only the two fighters.
hitstopEnabled=1
hitstopGlobal=1
; Global speed multiplier. 0.015 is a near-freeze.
hitstopWorldRate=0.015

; Hold times in real-time milliseconds. Set a duration to 0 to disable that pulse.
bladeHitstopMs=115
kickHitstopMs=145
heavyHitstopMs=175
; Scale Ephemera's outgoing hitstop. Her Triangle flurry only pauses on the last cut.
ephemeraHitstopScale=0.50

; Minimum native hit severity for the heavy hitstop profile.
heavyMinSeverity=4

; Minimum interval between pulses in real-time milliseconds. Pulses do not stack.
hitstopGapMs=105

; Actor speed multipliers used only when hitstopGlobal=0.
hitstopRayneRate=0.015
hitstopTargetRate=0.01

; Brief hitstop when a melee hit takes health from Rayne.
; This pulse also requires hitstopEnabled and never extends an active pulse.
receivedHitstopEnabled=1
; Durations in real-time milliseconds below and at or above receivedHitstopMinSeverity.
receivedLightHitstopMs=20
receivedHitstopMs=45
receivedHitstopWorldRate=0.05
receivedHitstopMinSeverity=4
receivedHitstopRayneRate=0.10
receivedHitstopAttackerRate=0.05

; Extra impact sounds, played once per attack.
bladeSound=1
kickSound=1

; Camera shake strength per impact type. Set to 0 to disable that shake.
bladeShake=0.0
kickShake=800.0
heavyShake=1700.0
meleeShakeMs=100

; Gun feedback. The heavy pulse is reserved for scatter shots and explosions.
rangedFeedback=1
rangedGapMs=180
rangedHeavyHitstopMs=38
rangedLightShake=300.0
rangedHeavyShake=1300.0
rangedShakeMs=120

; Sound and camera feedback when the harpoon catches an enemy.
harpoonFeedback=1
harpoonSound=1
harpoonShake=1000.0
harpoonShakeMs=120

; Blade or kick input buffer during a harpoon pull, in real-time milliseconds. Set to 0 to disable it.
harpoonComboBufferMs=230

; Recovery protection after taking damage, in real-time milliseconds. Blocked hits do not refresh it.
recoveryMs=300

; Protected attack types and maximum severity. Set recoveryMs to 0 to disable all recovery protection.
recoveryMelee=1
recoveryBullets=1
recoveryMaxSeverity=4

; Twisted Wind blocks enemy melee during the opening of the active kick.
; Duration is in animation-time milliseconds and capped at the active kick range.
twistedWindInvulnerabilityEnabled=1
twistedWindInvulnerabilityMs=350

; On-screen hit counter. Counts confirmed hits by enemy and attack.
comboEnabled=1

; Maximum gap between consecutive hits, in real-time milliseconds.
comboWindowMs=2300
comboMinHits=2
comboRanged=1

; Count all pellets from one shot against the same enemy as one hit.
comboGroupScatter=1
comboHarpoonDamage=1
comboBreakOnDamage=1

; Right anchor and vertical position as fractions of the screen.
comboX=0.95
comboY=0.40

; Enable recovery protection after taking damage.
recoveryEnabled=1

; Enable the follow-up input buffer during a harpoon pull.
harpoonBufferEnabled=1

; COMBO FINISHERS
; Detects native three-hit combo finishers. The circular attack can also be included.
; Particle scale and field of view are multipliers. Set finisherFov to 1 to disable finisher zoom.
finisherEnabled=1
finisherCircle=1
finisherFx=1
finisherFxScale=2.0
finisherFxMs=480
finisherSound=1
finisherShake=2300.0

; Finisher hitstop duration in real-time milliseconds. This pulse also requires hitstopEnabled.
finisherHitstopMs=235
finisherShakeMs=180
finisherFov=0.94
finisherFovMs=220

; Slowdown on a killing finisher. If it overlaps a parry, the stronger slowdown takes precedence.
finisherKillSlow=1
finisherKillRate=0.48
finisherKillHoldMs=100
finisherKillFadeMs=200
finisherCooldownMs=400

; PARRY RIPOSTE
; Adds feedback to the next blade hit or kick against the parried attacker.
riposteEnabled=1

; Time to land the riposte after a successful parry, in real-time milliseconds.
riposteWindowMs=1250
riposteFx=1
riposteFxScale=1.65
riposteFxMs=400
riposteSound=1
riposteShake=2000.0
riposteShakeMs=145
riposteHitstopMs=210

; DODGE OFFSET
; Dodge during a blade or kick chain, then tap an attack during or just after the dodge.
; A missed swing can carry the chain. The style bonus requires a hit from the follow-up.
dodgeOffsetEnabled=1

; Grace period after the last eligible swing before dodging, in game-time milliseconds.
dodgeOffsetSourceMs=600

; Time to press the follow-up after control returns, in game-time milliseconds.
dodgeOffsetResumeMs=300

; Keep one attack press through the full dodge. Set to 0 to require a press after it.
dodgeOffsetBufferEnabled=1
dodgeOffsetBlade=1
dodgeOffsetKick=1

; FEEDING EXECUTIONS. Camera and slowdown effects are suppressed during the native time powers.
feedExecutionEnabled=1
; One bit per execution in move-list order, excluding gun executions. 1023 enables all ten.
feedExecutionMask=1023
; Speed during an execution. 0.18 means 18% of normal speed. Set to 1 to disable slowdown.
feedExecutionSlowRate=0.18
; Full slowdown hold, separate hold for Crane's Reply, and return to normal speed. All times are real milliseconds.
feedExecutionSlowHoldMs=1000
feedExecutionSpinHoldMs=1100
feedExecutionSlowFadeMs=250
; Native camera zoom multiplier. 1 disables zoom. Higher values zoom in more (up to 2.5).
feedExecutionFov=1.67
; Ease in, hold at full zoom, and ease back out. All times are real milliseconds.
feedExecutionFovInMs=200
feedExecutionFovHoldMs=1000
feedExecutionFovFadeMs=350
; Downward camera tilt in degrees for the rear head-stomp execution only.
feedHeadStompTiltDeg=4.0

; Use the same slow-motion and smooth zoom for a severed body part or a ground strike.
; Both require a victim that was alive before Rayne's hit. Both are suppressed during native bullet time.
dismemberCinematicEnabled=1
groundCinematicEnabled=1
; Minimum time between gameplay cinematics in real-time milliseconds. Active cinematics also prevent overlap.
combatCinematicGapMs=1500

; STYLE RANK
; D, C, B, A, S, SS, SSS and V. The style streak is separate from the hit counter.
styleEnabled=1
styleWindowMs=3200
styleRepeatMs=1800

; Repeated melee moves are penalized for the current streak.
; Other actions are penalized when repeated within styleRepeatMs.
styleRepeatPercent=20
; Percentage for repeating the same combo ender in a streak.
styleFinisherRepeatPercent=20
; Each distinct scoring action or melee move raises the bonus for the next new action.
; Set either value to 0 to disable the bonus. Combo enders do not earn or advance it.
styleVarietyStepPercent=15
styleVarietyMaxPercent=60
styleMaxPoints=999999

; Base points per action. Set an action to 0 to exclude it.
styleBlade=70
styleKick=100
styleGun=55
styleHarpoon=120
styleParry=240
styleRiposte=320
styleFinisher=50
styleDodge=150

; Minimum streak points for each rank. Thresholds are enforced in ascending order.
styleRankC=220
styleRankB=500
styleRankA=900
styleRankS=1450
styleRankSS=2600
styleRankSSS=4500
styleRankV=8000
styleBreakOnDamage=1

; Show the score next to the rank letter.
styleShowPoints=1
styleRankSound=1
styleFlashMs=230

; Horizontal and vertical position as fractions of the screen.
styleX=0.95
styleY=0.46


; Target shots available in the shared blood pool for each gun level.
; The engine converts the ammo cost to an integer, so counts are approximate.
; Values are clamped to 1..1000. Requires Combat > Enhanced Gun Combat.
bloodShotAmmoPoolL1=270
bloodShotAmmoPoolL2=300
bloodShotAmmoPoolL3=330
bloodStreamAmmoPoolL1=135
bloodStreamAmmoPoolL2=180
bloodStreamAmmoPoolL3=225
bloodSprayAmmoPoolL1=45
bloodSprayAmmoPoolL2=53
bloodSprayAmmoPoolL3=60
bloodBombAmmoPoolL1=30
bloodBombAmmoPoolL2=38
bloodBombAmmoPoolL3=45
bloodFlameAmmoPoolL1=23
bloodFlameAmmoPoolL2=27
bloodFlameAmmoPoolL3=33
bloodHammerAmmoPoolL1=18
bloodHammerAmmoPoolL2=21
bloodHammerAmmoPoolL3=24

; Conventional guns: automatic first pickup and duplicate ammo transfer use this radius (world units).
conventionalPickupRadius=5.0
conventionalLowAmmo=3
; Gameplay seconds before a deliberately discarded empty gun disappears.
conventionalDiscardSeconds=5.0
