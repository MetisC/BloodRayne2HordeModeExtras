[Difficulty]
; Global difficulty preset — cycles in Options > Difficulty
; Minion | Dhampir | Overlord | Unraveller | Custom
preset=Dhampir

[Custom]
; Multipliers for the "Custom" preset — read live from this file.
;   dmgIn  = damage Rayne receives      (1.0 = normal, 0.5 = half, 2.0 = double)
;   dmgOut = damage Rayne deals         (1.0 = normal, 0.5 = half, 2.0 = double)
;   cost   = rage cost of powers        (1.0 = normal, 0.5 = half, 2.0 = double)
dmgIn=0.1
dmgOut=10.0
cost=0.5

[Appearance]
; Global outfit override — cycles in Options > Skin.
; "default" = no override (native outfit system / Gunsucked untouched).
; Otherwise an internal outfit name, e.g. rayne | rayne_dress |
; rayne_dress_blue | rayne_dress_red | rayne_dress_dragon |
; rayne_dress_green | rayne_dark | rayne_cowgirl | rayne_armor |
; rayne_schoolgirl — applies everywhere, including level-forced outfits.
skin=default

[Diagnostics]
; Opt-in only. Leave these off for normal play and load-speed comparisons.
LoaderTrace=0
WatchGlassPointer=0
LegacyGuards=0
ChainTrace=0
; 1 = per-frame victim anim log to br2mod_feed.log (feed research)
feedLog=0
; 1 = log every health/rage store (object, PLAYER flag, old/new, multiplier)
; to br2mod_diff.log — for the difficulty-effectiveness test.
DifficultyTrace=0

[Challenge]
; Last Challenge Mode selection — the menu writes it back on change.
;   count = enemies per run: 15 | 25 | 50 | 100 | 250
;   guns  = 0 (No) | 1 (Yes)
;   maxBars = 0 (base health/rage capacity) | 1 (campaign maximum)
count=25
guns=0
maxBars=0
